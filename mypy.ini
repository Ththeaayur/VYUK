# VYUK type-check baseline configuration (v5.50, programme item 43).
#
# Run from the package root:
#
#     mypy --config-file mypy.ini
#
# BASELINE mechanism: mypy_baseline.txt (package root) holds the
# full, sorted mypy output measured at v5.50 with mypy 2.4.0.
# The check is: re-run the command above, sort the output, and
# diff against mypy_baseline.txt — any NEW line is a new type
# error to fix or to consciously add to the baseline with a
# reason; vanished lines mean the baseline should shrink. This
# config deliberately does NOT demand typed code from a tree
# that was written dynamically (untyped defs are not errors
# here); it catches name/attr/arg mismatches in the code that
# IS annotated plus every call mypy can infer. Zero-error is
# the direction of travel, not the v5.50 claim.

[mypy]
python_version = 3.12
files = core, gui, doctor.py, main.py
ignore_missing_imports = True
follow_imports = normal
check_untyped_defs = False
disallow_untyped_defs = False
# warn_untyped_fields REMOVED (mypy re-baseline 2026-11-05): unrecognized in mypy 2.4.0; no such option exists, removal changes nothing
show_error_codes = True
no_error_summary = False

# PySide6 signals/slots and the item-43 mixin composition are
# heavily dynamic; per-module relaxations would hide more than
# they catch at baseline time, so none are set yet.
