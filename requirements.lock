# requirements.lock — exact pins for VYUK's DIRECT dependencies.
#
# v5.50, programme item 44 (packaging truth): this file pins, with
# exact == versions, every ACTIVE direct dependency declared in
# requirements.txt, so a build resolves the same versions every
# time instead of whatever ">= floor" floats to on build day.
# requirements.txt stays the human-edited declaration (floors +
# rationale); this lock is the build's reproducibility record.
# Regenerate deliberately: re-resolve each floor against the
# project venvs below and update the pin + its source note.
#
# SOURCES — every pin traces to a real installed version; no
# version below was invented or copied from a changelog:
#   1. Packaging kit manifest (packaging/assets_manifest.json /
#      gen_manifest.py): consulted first — it pins model/asset
#      files only and carries NO Python package pins, so it
#      contributes nothing here.
#   2. requirements.txt: the set of direct dependencies (the
#      ACTIVE, non-comment lines) and their floors.
#   3. Versions actually installed in the project's venvs
#      (pip freeze / importlib.metadata, read 2026-10-23):
#      ~/workspace/code-lab/.venv-qt, .venv-brain, .venv-gx3 and
#      .venv-kokoro (the four venvs named for this item), plus the
#      packaging build venv .venv-build — the venv
#      build_installer.ps1 stage 1 creates from requirements.txt,
#      hence the most complete resolution of these exact floors —
#      and .venv-pw (Playwright). Per-pin source venvs are noted
#      in the trailing comments.
#
# CONFLICT NOTE: websockets is 16.1.1 in .venv-gx3 and .venv-build
# but 17.3 in .venv-kokoro (where it rides along as a transitive
# install, not a direct one). The pin follows the two agreeing
# sources, including the build venv: 16.1.1.
#
# UNRESOLVED — declared in requirements.txt but NOT pinned here,
# because no project venv has them installed and inventing a
# version would be worse than admitting the gap:
#   pywinauto   (win32-only hard dep, v5.48 item 25 — a Linux venv
#               cannot hold it; pin from the Windows build machine)
#   pycaw       (win32-only hard dep, v5.48 item 25 — same reason)
#   pytesseract (the Python wrapper is absent from every project
#               venv; the Tesseract BINARY itself is staged by the
#               installer, see packaging/build_installer.ps1)
#   comtypes    (win32-only, v5.54 — rides transitively with
#               pywinauto/pycaw; 1.4.17 is the current release)
#   dxcam       (win32-only, B-D5 — sdist-only, no wheel; pin
#               dxcam==0.3.0 from the Windows build machine)
#   aiortc      (B-D6 — not installed in any project venv; pin
#               aiortc==1.16.0 from the Windows build machine)
# The six are named in the commented lines at the bottom so the
# gap is visible in the file, not just in the phase notes.
#
# Optional/commented declarations in requirements.txt (pypdf,
# piper-tts) are NOT direct dependencies and are not pinned here.

