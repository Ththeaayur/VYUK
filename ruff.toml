# VYUK lint configuration (v5.50, programme item 43).
#
# There is NO CI workflow file in this tree: item 44 named a
# workflow path under packaging/, but it was never created
# (packaging/ has no .github directory) and no hosted CI
# pipeline exists for this project (see tests/CANONICAL_CI.md
# — the "CI" here is the canonical lab run, not a hosted
# pipeline). Ruff is run by hand, from the package root:
#
#     ruff check --config ruff.toml .
#
# The lab enforces the same bans without a ruff binary via
# the grep tests (e.g. tests/test_commanddeck_guards.py for
# the stock-dialog ban below).
# BASELINE, not zero-error fantasy: this config documents the
# tree's state at v5.50 and keeps the gate GREEN on it, while
# enforcing the rule classes that catch real breakage (syntax
# E9, undefined names F821, unused names in new code paths).
# Counts below were measured with ruff 0.17.2 at item-43 time on
# the shipped rule set (E4/E7/E9/F). Tighten rule by rule: when a
# class reaches zero, delete its ignore line — do not add new
# ignores without a count and a reason here.

target-version = "py312"
# The codebase is not line-length formatted; E501 is not selected.
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F", "TID252"]

# Command Deck Phase A (guide §11.2): stock dialogs are banned. TID252
# covers the import; the grep test in tests/test_commanddeck_guards.py
# covers QtWidgets.QMessageBox-style attribute access, which import
# bans miss. The per-file list below is the Phase A allowlist — it
# only shrinks, and it is EMPTY by Phase C. Ruff has no binary in
# the lab, so this section is CI-verified; the grep test enforces
# the same ban in lab runs.
[lint.flake8-tidy-imports]
banned-api = {
    "PySide6.QtWidgets.QMessageBox" = "Use gui.design_system.dialogs.HudDialog (Command Deck); stock dialogs are banned.",
    "PySide6.QtWidgets.QInputDialog" = "Use gui.design_system.dialogs.HudDialog (Command Deck); stock dialogs are banned.",
}
ignore = [
    # F401 unused-import — 971 at baseline. This codebase's house
    # style is import-and-re-export: skill packs, the P-3 platform
    # seam, and (since v5.50 item 43) the gui/main_window.py and
    # core/tools.py re-export shims bind names precisely so other
    # modules can import them from there. Audited at split time
    # (the item-43 split modules carry trimmed headers; the two
    # shims' full headers are the re-export surface itself).
    "F401",
    # E402 module-import-not-at-top — 17 at baseline: bootstrap
    # code (sys.path setup, the portaudio shim, the item-43 patch-
    # forwarding setup in the two shims) imports after statements
    # on purpose.
    "E402",
    # F541 f-string-without-placeholders — 7 at baseline
    # (core/plugin_loader.py x4, core/skills_fun.py,
    # core/skills_productivity_day.py, core/skills_system_monitor.py).
    "F541",
    # E741 ambiguous-variable-name `l` — 3 at baseline
    # (core/planner.py x2, core/skills_window_control.py).
    "E741",
    # F841 unused-variable — 2 at baseline, both pre-existing in
    # code the item-43 split moved verbatim
    # (gui/window_brain.py: display_host, ok).
    "F841",
    # E702 multiple-statements-on-one-line — 1 at baseline,
    # pre-existing in code moved verbatim to gui/window_widgets.py.
    "E702",
]

[lint.per-file-ignores]
# KNOWN DEFECTS, documented rather than fixed by item 43 (a lint
# item must not silently rewrite skill behaviour): four F821
# undefined-name sites that pre-date v5.50 —
#   core/skills_media.py:720,733  _RECORD_RATE (x3)
#   core/skills_system_bench.py:114    _SEP
# They stay visible here by name; every OTHER file enforces F821.
"core/skills_media.py" = ["F821"]
"core/skills_system_bench.py" = ["F821"]
# The shipped tests legitimately build fake module objects and
# patch attributes; unused imports there are fixture noise.
# Tests also mock the banned stock dialogs; they never ship one.
"tests/*.py" = ["F401", "TID252"]
# Command Deck Phase C stock-dialog allowlist (guide §11.2): EMPTY.
# All 10 Phase A files migrated to HudDialog in Phase C; their
# per-file lines were removed with their migrations.
